<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Landing Page Simples</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="landing-pai">

      <section class="lado-esquerdo">

        <header class="logo-area">
        <img>
          <h1>Curso de Yoga da Criss</h1>
        </header>

        <article class="content">
          <p class="subtitle">Aulas de yoga particular</p>
          <h2>Ganhe as melhores<br />aulas de yoga da cidade!</h2>
          <p class="texto">
            Um curso para pessoas que querem aprender a praticar yoga, melhorar a flexibilidade, reduzier o estresse e alcançar um eliquibrio interior
          </p>
        </article>

        <form class="dados">
          <input type="text" placeholder="Seu Nome" />
          <input type="email" placeholder="Seu Telefone" />
          <button type="submit">MATRICULAR-SE</button>
        </form>
      </section>

      <section class="lado-direito">
        <img class="coz" src="Yoga-PNG-Picture.png" alt="yoga" />
      </section>
    </main>
  </body>
</html>
